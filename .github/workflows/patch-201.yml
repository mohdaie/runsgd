name: RunSGD v2.0.1 Gemini 3.5

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v2.0.1 patch
        run: python3 patch_201.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin/index.html
          git commit -m "RunSGD v2.0.1: switch UI to Gemini 3.5 Flash-Lite"
          git push
