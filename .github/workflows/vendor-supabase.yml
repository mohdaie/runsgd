name: Vendor supabase-js (one-off)
on:
  push:
    branches: [fix/self-host-supabase]
    paths: [.github/workflows/vendor-supabase.yml]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download the exact build jsdelivr serves for @supabase/supabase-js@2
        run: |
          set -euo pipefail
          V=$(npm view @supabase/supabase-js@2 version --json | node -e 'let v=JSON.parse(require("fs").readFileSync(0));console.log(Array.isArray(v)?v[v.length-1]:v)')
          echo "Resolved version: $V"
          npm pack "@supabase/supabase-js@$V" --silent
          tar xzf supabase-supabase-js-$V.tgz
          F=$(node -e 'const p=require("./package/package.json");console.log(p.jsdelivr||p.unpkg||"dist/umd/supabase.js")')
          echo "jsdelivr entry file: $F"
          mkdir -p assets/vendor
          cp "package/$F" "assets/vendor/supabase-js-$V.js"
          SRI="sha384-$(openssl dgst -sha384 -binary assets/vendor/supabase-js-$V.js | openssl base64 -A)"
          printf '{\n  "package": "@supabase/supabase-js",\n  "version": "%s",\n  "source": "npm %s (same file jsdelivr serves for @2)",\n  "file": "assets/vendor/supabase-js-%s.js",\n  "integrity": "%s"\n}\n' "$V" "$F" "$V" "$SRI" > assets/vendor/supabase-js.json
          cat assets/vendor/supabase-js.json
          rm -rf package supabase-supabase-js-$V.tgz
      - name: Commit vendored file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor
          git commit -m "Vendor supabase-js UMD build (pinned)"
          git push
