name: Deploy RunSGD to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stamp deployed build
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          SHORT_SHA="${GITHUB_SHA::7}"
          printf '{"version":"%s","build":"%s","commit":"%s"}\n' "$VERSION" "$GITHUB_RUN_NUMBER" "$SHORT_SHA" > build-info.json
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
