<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#f8fbff">
<title>Update RunSGD</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17213b;background:radial-gradient(circle at 8% 3%,#dff2ff 0,transparent 32%),radial-gradient(circle at 92% 8%,#efe5ff 0,transparent 30%),linear-gradient(180deg,#fbfdff,#faf9ff 58%,#fffaf7)}
.box{width:min(420px,100%);background:#ffffffee;border:1px solid #fff;border-radius:26px;padding:26px;box-shadow:0 18px 50px #53617f18;text-align:center}.brand{font-weight:950;font-size:34px;letter-spacing:-2px;background:linear-gradient(90deg,#17447f,#3981f6,#8b5cf6,#ef78ad);-webkit-background-clip:text;color:transparent}.spin{width:36px;height:36px;border-radius:50%;border:4px solid #e5eaf5;border-top-color:#5d7cf2;margin:24px auto 17px;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}h1{font-size:22px;margin:0}.sub{color:#77839a;font-size:14px;line-height:1.55;margin-top:8px}.status{margin-top:18px;border-radius:14px;background:#f2f6ff;padding:11px 13px;color:#53627e;font-size:12px;font-weight:750}.btn{display:none;width:100%;border:0;border-radius:999px;padding:12px 16px;margin-top:14px;background:linear-gradient(120deg,#4b82f5,#8b67ef);color:#fff;font-weight:900}
</style>
</head>
<body>
<main class="box">
 <div class="brand">runSGD</div>
 <div class="spin"></div>
 <h1>Refreshing RunSGD</h1>
 <div class="sub">Removing the old app shell and loading the latest published version.</div>
 <div id="status" class="status">Preparing clean update…</div>
 <button id="retry" class="btn" onclick="rescue()">Retry update</button>
</main>
<script>
const U='https://gdycbluljgfezhgslppe.supabase.co',K='sb_publishable_ke21EcVtLjGPLwX2T_-xng_CnhM6HBM';
const $=id=>document.getElementById(id);
async function latestVersion(){
 try{
  const r=await fetch(U+'/rest/v1/app_content?key=eq.release_version&select=content&_ts='+Date.now(),{cache:'no-store',headers:{apikey:K,Authorization:'Bearer '+K,'Cache-Control':'no-cache'}});
  if(r.ok){const j=await r.json();const v=String(j?.[0]?.content||'').trim().replace(/^v/i,'');if(v)return v}
 }catch{}
 try{const r=await fetch('/VERSION?ts='+Date.now(),{cache:'no-store'});if(r.ok)return (await r.text()).trim().replace(/^v/i,'')}catch{}
 return '2.15.10'
}
async function rescue(){
 $('retry').style.display='none';$('status').textContent='Clearing old RunSGD cache…';
 try{
  if('serviceWorker' in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.filter(r=>{try{return new URL(r.scope).origin===location.origin}catch{return false}}).map(r=>r.unregister()))
  }
 }catch{}
 try{
  if('caches' in window){
   const keys=await caches.keys();
   await Promise.all(keys.filter(k=>k.startsWith('runsgd-shell-')).map(k=>caches.delete(k)))
  }
 }catch{}
 const v=await latestVersion();
 $('status').textContent='Loading RunSGD v'+v+'…';
 const target='/?appv='+encodeURIComponent(v)+'&_rescue='+Date.now()+'#home';
 setTimeout(()=>location.replace(target),150)
}
rescue().catch(e=>{$('status').textContent='Automatic refresh could not finish. Tap Retry.';$('retry').style.display='block'});
</script>
</body>
</html>
