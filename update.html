<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Update RunSGD</title>
  <style>
    body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;box-sizing:border-box;background:#eef7ff;color:#17213b;font:16px/1.5 system-ui,sans-serif}
    main{max-width:400px;width:100%;padding:28px;border-radius:24px;background:white;box-shadow:0 12px 32px #46537d12}
    h1{font-size:24px;margin:0 0 10px}p{margin:0;color:#536078}button{margin-top:18px;border:0;border-radius:14px;padding:12px 18px;background:#496eea;color:white;font:700 16px system-ui;cursor:pointer}
  </style>
</head>
<body>
  <main><h1>Updating RunSGD</h1><p id="status" role="status" aria-live="polite">Checking the latest app…</p><button id="retry" type="button" onclick="location.reload()" hidden>Try again</button></main>
  <script>
    (async()=>{
      const status=document.getElementById('status');
      try{
        const response=await fetch('/index.html?_recover='+Date.now(),{cache:'no-store'});
        if(!response.ok)throw new Error('Latest app unavailable');
        const html=await response.text();
        const version=html.match(/const RUNSGD_VERSION\s*=\s*['"](\d+\.\d+\.\d+)['"]/)?.[1];
        if(!version)throw new Error('Cannot verify latest app');
        status.textContent='Clearing old cached pages…';
        if('caches' in window){
          const names=await caches.keys();
          await Promise.all(names.filter(name=>name.startsWith('runsgd-shell-')).map(name=>caches.delete(name)));
        }
        const next=new URL('/',location.origin);
        next.searchParams.set('appv',version);
        next.searchParams.set('_refresh',String(Date.now()));
        location.replace(next.href);
      }catch{
        status.textContent='Could not reach the latest app. Check your connection and try again.';
        document.getElementById('retry').hidden=false;
      }
    })();
  </script>
</body>
</html>
